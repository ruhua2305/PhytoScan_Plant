seed: 42
species: "apple"
data:
  split_manifest: "D:/DAT301m_Project/Final_Pipeline/data/splits/apple_split_v1.json"
  img_size: 224
  num_workers: 2
  rare_class_threshold: 30
model:
  arch: "tf_efficientnetv2_s.in1k"
  pretrained_ckpt: "D:/DAT301m_Project/Final_Pipeline/checkpoints/backbone_pretrained.pt"
train:
  batch_size: 16
  accumulation_steps: 4
  epochs_warmup: 3
  epochs_full: 20
  epochs_decoupled: 3
  early_stop_patience: 6      # dừng bước full nếu 6 epoch không cải thiện
  lr_head: 1.0e-3
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  use_amp: true
  cutmix_mixup: {enabled: true, alpha: 0.2, cutmix_prob: 0.5, p: 0.5}
  class_balanced_loss: {beta: 0.9999, gamma: 2.0}
  domain_mmd: {enabled: false, lambda_max: 0.1, warmup_epochs: 5, source_dir: "D:/DAT301m_Project/Final_Pipeline/data/1. PRETRAIN DATASET/train"}
checkpoint:
  out_path: "D:/DAT301m_Project/Final_Pipeline/checkpoints/model_apple.pt"
  metric: "macro_f1"
