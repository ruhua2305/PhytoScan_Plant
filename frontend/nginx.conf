server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow leaf uploads up to the API limit (10 MB) plus a small cushion.
    client_max_body_size 11m;

    # SPA fallback for React Router-style client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy prediction and health to the FastAPI service on the compose network.
    location /predict {
        proxy_pass http://api:8000/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
}
