[project]
name = "leafscan-backend"
version = "1.0.0"
description = "Plant disease detection API (FastAPI + ONNX Runtime)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "onnxruntime==1.18.0",
    "Pillow==10.3.0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.0",
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "ruff==0.5.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
